name: yash-fynd
services:
  postgres:
    image: postgres:17
    container_name: yash-fynd-postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - yash_fynd_hackthon_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8.10-alpine
    container_name: yash-fynd-redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data

volumes:
  yash_fynd_hackthon_postgres_data:
  redis-data:
